name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    env:
      # SQLite is enough for CI — no service container needed, and the schema is identical to
      # the PostgreSQL one used in production.
      DATABASE_URL: 'file:./ci.db'
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database schema
        run: npm run db:push -w @campuslink/api -- --skip-generate

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
